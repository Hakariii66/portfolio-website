<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+SemiExpanded:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
    <title>Portfolio Website</title>
    <style>

        @font-face {
            font-family: DS-DIGI;
            src: url(./asset/DS-DIGI.TTF);
        }

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-image: url(./asset/Banner.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            font-family: Zalando Sans SemiExpanded;
            display: flex;
            flex-direction: column;
        }

        .time{
            font-family: DS-DIGI;
            font-weight: bolder;
        }

        .navbar {
            position: fixed; /* Membuat navbar melayang di atas konten */
            top: 25px;       /* Jarak dari atas layar */
            left: 50%;       /* Posisikan di tengah layar horizontal */
            transform: translateX(-50%); /* Penyesuaian agar benar-benar presisi di tengah */
            width: 90%;      /* Lebar navbar */
            max-width: 450px;
            z-index: 1000;   /* Memastikan navbar selalu berada di lapisan paling atas */
        }

        .container-nav{
        display: flex; /* Menggunakan Flexbox */
        justify-content: space-between;
        align-items: center; /* Meratakan elemen secara vertikal agar sejajar */
        background-color: rgba(255, 255, 255, 0.9); /* Efek transparan */
        padding: 15px 30px;
        border-radius: 50px; /* Membuat sudut membulat/pill */
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Efek bayangan (floating) */
        }

        .nav-links {
        display: flex; /* Flexbox bertingkat untuk menu */
        gap: 20px;
        list-style: none;
        }

        .navbar .container-nav .nav-links li a{
            text-decoration: none;
            color: black;
            font-weight: 500;
        }

        main {
            flex: 1;  /* Membuat main mengisi sisa ruang setelah navbar */
            display: flex;
            flex-direction: column;
            justify-content: center;  /* Vertikal tengah */
            align-items: center;      /* Horizontal tengah */
            min-height: 100vh;        /* Pastikan setinggi layar */
        }

        main h1 {
            font-size: 5rem;
            text-align: center;
            color: white;  /* Agar kontras dengan background */
            text-shadow: 2px 2px 10px rgba(0,0,0,1);
        }

        ::selection {
            background-color: #ffffff; /* Warna latar belakang seleksi */
            color: #000000;            /* Warna teks saat terseleksi */
        }
       
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container-nav">
            <div class="time"></div>
            <ul class="nav-links">
                <li><a href="#">Beranda</a></li>
                <li><a href="#">Profil</a></li>
                <li><a href="#">Showcase</a></li>
            </ul>
        </div>
    </nav>
    <main>
        <h1>WELCOME TO MY WEBSITE</h1>
    </main>
    <script>
        // fungsi buat tampilkan waktu saat ini
        function updateTime() {
            const timeElement = document.querySelector('nav .time');
            const now = new Date();
            
            let hours = now.getHours();
            
            const am_pm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12;
            hours = hours.toString().padStart(2, '0');
            
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            timeElement.textContent = `${hours}:${minutes}:${seconds} ${am_pm}`;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
